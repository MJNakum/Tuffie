[package]
name = "tuffie"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A fast, local-first and self-hostable UI for Terraform and OpenTofu"
license = "MIT"
repository = "https://github.com/MJNakum/Tuffie"
readme = "README.md"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
futures-util = "0.3"
libc = "0.2"
mime_guess = "2"
portable-pty = "0.9"
rand = "0.8"
regorus = { version = "0.15", default-features = false, features = ["std", "arc", "regex", "glob", "semver", "time", "base64", "hex", "net"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
